# ============================================================
# Maple Mono + Everforest – Kitty config for macOS
# ============================================================

# ----- Font -----
font_family      family="Maple Mono NF"
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 14.0
modify_font cell_height 140%

# ----- OpenType features -----
font_features MapleMonoNF-Regular +calt +liga
font_features MapleMonoNF-Italic  +calt +liga
font_features MapleMonoNF-Bold    +calt +liga
font_features MapleMonoNF-BoldItalic +calt +liga

# ----- True color -----
# Kitty already supports true color by default.
# This makes the terminfo advertise it clearly.
term xterm-kitty

# Tab 
tab_bar_style powerline
tab_powerline_style round

# ----- Everforest Dark Hard theme -----
foreground                      #d3c6aa
background                      #272e33
selection_foreground            #9da9a0
selection_background            #464e53

cursor                          #d3c6aa
cursor_text_color               #2e383c

url_color                       #7fbbb3

active_border_color             #a7c080
inactive_border_color           #4f5b58
bell_border_color               #e69875

active_tab_background           #272e33
active_tab_foreground           #d3c6aa
inactive_tab_background         #374145
inactive_tab_foreground         #9da9a0
tab_bar_background              #2e383c

# black
color0   #343f44
color8   #868d80

# red
color1   #e67e80
color9   #e67e80

# green
color2   #a7c080
color10  #a7c080

# yellow
color3   #dbbc7f
color11  #dbbc7f

# blue
color4   #7fbbb3
color12  #7fbbb3

# magenta
color5   #d699b6
color13  #d699b6

# cyan
color6   #83c092
color14  #83c092

# white
color7   #859289
color15  #9da9a0

# ----- macOS specific -----
macos_option_as_alt yes
macos_colorspace displayp3
macos_thicken_font 0.4
macos_show_window_title_in none
macos_window_resizable yes
macos_traditional_fullscreen no

# Quit Kitty when the last window is closed
macos_quit_when_last_window_closed yes

# ----- Cursor -----
cursor_shape block
cursor_blink_interval 0.6
cursor_stop_blinking_after 15.0

# ----- Window / padding -----
window_padding_width 10
hide_window_decorations no
confirm_os_window_close 0
background_opacity 0.95

# ----- Performance -----
repaint_delay 8
input_delay 2
sync_to_monitor yes

# ----- Shell integration -----
shell_integration enabled
allow_remote_control yes
listen_on unix:/tmp/kitty

# ----- Clipboard -----
copy_on_select clipboard
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# Shortcuts
# Enable the splits layout
enabled_layouts splits

# Custom shortcuts for horizontal and vertical splits
map cmd+minus launch --location=hsplit --cwd=last_reported
map cmd+backslash launch --location=vsplit --cwd=last_reported

window_drag_tolerance 4


